name: Bump App Version CI

on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: "20 */4 * * *"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    env:
      OWNER: FriesI23
      REPO: mhabit
      FLATPAK_FLUTTER_VERSION: 0.15.0
      PATCH_NAME: changes.patch
    outputs:
      patch-name: ${{ env.PATCH_NAME }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: flathub/io.github.friesi23.mhabit
          ref: master
          token: ${{ secrets.AUTO_CI_TOKEN }}
      - uses: sersoft-gmbh/setup-gh-cli-action@v3
        with:
          version: stable
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          cd ..
          curl -L https://github.com/TheAppgineer/flatpak-flutter/archive/refs/tags/${{ env.FLATPAK_FLUTTER_VERSION }}.tar.gz \
            -o flatpak-flutter.tar.gz
          tar -xzf flatpak-flutter.tar.gz
          mv flatpak-flutter-${{ env.FLATPAK_FLUTTER_VERSION }} flatpak-flutter
      - run: |
          python -m pip install --upgrade pip
          pip install PyYAML
          pip install -r ../flatpak-flutter/requirements.txt
      - name: Get Latest Release
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.AUTO_CI_TOKEN }}
          REPO: ${{ env.OWNER }}/${{ env.REPO }}
        run: |
          TAG=$(
            gh release list \
              --exclude-pre-releases \
              --exclude-drafts \
              --repo "$REPO" \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )
          COMMIT=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Show Release Info
        run: |
          echo "Latest tag: ${{ steps.release-info.outputs.tag }}"
          echo "Commit SHA: ${{ steps.release-info.outputs.commit }}"
      - name: Get current Release Info
        id: tag-diff
        env:
            FILE: flatpak-flutter.yml
            NEW_TAG: ${{ steps.release-info.outputs.tag }}
        run: |
          set -e
          RAW_TAG=$(yq -r '.modules[]
            | select(.name == "mhabit")
            | .sources[]
            | select(.url == "https://github.com/FriesI23/mhabit.git")
            | .tag' "$FILE")
          echo "RAW_TAG=$RAW_TAG"
          TAG="${RAW_TAG#*-}"
          echo "TAG=$TAG"
          echo "NEW_TAG=$NEW_TAG"
          if [ "$TAG" != "$NEW_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update flatpak-flutter.yml
        if: steps.tag-diff.outputs.changed == 'true'
        env:
          FILE: flatpak-flutter.yml
          URL: https://github.com/FriesI23/mhabit.git
          NEW_TAG: ${{ steps.release-info.outputs.tag }}
          NEW_COMMIT: ${{ steps.release-info.outputs.commit }}
        run: >
          yq -i e
          '(.modules[].sources[] | select(.url == env(URL)) | .tag) = env(NEW_TAG)
          | (.modules[].sources[] | select(.url == env(URL)) | .commit) = env(NEW_COMMIT)'
          "$FILE"
      - name: Sync Flutter SDK tag
        id: flutter-sdk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTO_CI_TOKEN }}
          APP_REPO: ${{ env.OWNER }}/${{ env.REPO }}
          RELEASE_COMMIT: ${{ steps.release-info.outputs.commit }}
          FILE: flatpak-flutter.yml
        run: |
          export APP_URL="https://github.com/$APP_REPO.git"
          SOURCE='.modules[] | select(.name == "mhabit") | .sources[] | select(.type == "git")'
          APP_COMMIT=$(yq -er "$SOURCE | select(.url == strenv(APP_URL)) | .commit" "$FILE")
          if [[ ! "$APP_COMMIT" =~ ^[0-9a-f]{40}$ || "$APP_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "Manifest app commit '$APP_COMMIT' does not match release commit '$RELEASE_COMMIT'." >&2
            exit 1
          fi

          SDK_COMMIT=$(gh api "repos/$APP_REPO/git/trees/$APP_COMMIT" --jq \
            '.tree[] | select(.path == ".flutter" and .mode == "160000" and .type == "commit") | .sha')
          if [[ ! "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No .flutter gitlink found in app commit $APP_COMMIT." >&2
            exit 1
          fi

          SDK_SOURCE="$SOURCE | select(.dest == \"flutter\")"
          SDK_URL=$(yq -er "$SDK_SOURCE | .url" "$FILE")
          CURRENT_TAG=$(yq -er "$SDK_SOURCE | .tag" "$FILE")
          if [[ ! "$CURRENT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one stable Flutter tag in $FILE, found '$CURRENT_TAG'." >&2
            exit 1
          fi

          SDK_TAG=$(git ls-remote --tags -- "$SDK_URL" 'refs/tags/[0-9]*' |
            awk -v sha="$SDK_COMMIT" '$1 == sha {
              sub(/^refs\/tags\//, "", $2)
              sub(/\^\{\}$/, "", $2)
              if ($2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print $2
            }')
          if [[ ! "$SDK_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected exactly one stable Flutter tag for $SDK_COMMIT, found '$SDK_TAG'." >&2
            exit 1
          fi

          if [[ "$SDK_TAG" != "$CURRENT_TAG" ]]; then
            SDK_TAG="$SDK_TAG" yq -i "($SDK_SOURCE | .tag) = strenv(SDK_TAG)" "$FILE"
            printf 'previous_tag=%s\n' "$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for changes
        id: diff
        run: |
          python3 scripts/update-sqlite3-foreign.py
          git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Build Flatpak Flutter
        if: steps.diff.outputs.changed == 'true'
        env:
          PREVIOUS_FLUTTER_TAG: ${{ steps.flutter-sdk.outputs.previous_tag }}
        run: |
          mkdir -p assets/l10n
          touch assets/l10n/_untranslated.json
          python3 ../flatpak-flutter/flatpak-flutter.py flatpak-flutter.yml
          if [[ -n "$PREVIOUS_FLUTTER_TAG" ]]; then
            rm -f -- "generated/modules/flutter-sdk-$PREVIOUS_FLUTTER_TAG.json"
          fi
          rm -fr assets
      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_CI_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.release-info.outputs.tag }}"
          branch: "release/${{ steps.release-info.outputs.tag }}"
          delete-branch: true
          title: "Released: ${{ steps.release-info.outputs.tag }}"
          body: |
            - Link: [${{ steps.release-info.outputs.tag }}][1]
            - Auto-generated by [create-pull-request][2]

            [1]: https://github.com/FriesI23/mhabit/releases/tag/${{ steps.release-info.outputs.tag }}
            [2]: https://github.com/peter-evans/create-pull-request
          assignees: FriesI23
          maintainer-can-modify: true
          push-to-fork: FriesI23/flathub-io.github.friesi23.mhabit
          draft: false
      - name: Clear
        if: always()
        run: |
          rm -fr assets
